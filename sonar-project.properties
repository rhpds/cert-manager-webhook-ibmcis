sonar.projectKey=com.redhat.rhpds.cert-manager-webhook-ibmcis
sonar.qualitygate.wait=true

# Source exclusions
sonar.exclusions=**/*_test.go

# Test file patterns (analyzed with test-specific rules, separated from production metrics)
sonar.test.inclusions=**/*_test.go

# Go coverage report (generated by: go test -coverprofile=coverage.out ./...)
sonar.go.coverage.reportPaths=coverage.out
